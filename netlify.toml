[build]
  # Builds the Studio Narrator app, then the SPLURT game, which is served at /splurt/
  command = "npm run build && npm run build:splurt"
  publish = "dist"

[[redirects]]
  from = "/splurt/*"
  to = "/splurt/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
